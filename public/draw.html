<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="/images/ucl-logo.png">
  <meta name="theme-color" content="#070b14">
  <meta name="description" content="Build the league-phase draw for your 36-club tournament, reveal the fixtures, and set up a season of custom European football simulation.">
  <title>League phase draw · UCL Simulator XI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/pages/draw.css">
  <link rel="stylesheet" href="/assets/css/mobile.css">
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="draw-page">
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="app-shell">
    <aside class="side-rail" aria-label="Primary navigation">
      <nav class="side-navigation">
        <a class="nav-item" href="/" aria-label="Home" title="Home">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m3.5 10.5 8.5-7 8.5 7v9a1 1 0 0 1-1 1h-5.2v-6.2H9.7v6.2H4.5a1 1 0 0 1-1-1v-9Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a class="nav-item" href="/lineup" aria-label="Line-up" title="Line-up">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14.7 6.3a5 5 0 0 0-6.4-6.4l3.2 3.2-3.5 3.5-3.2-3.2a5 5 0 0 0 6.4 6.4l7.2 7.2a2 2 0 0 0 2.8-2.8l-6.5-6.5Z" transform="translate(1 1)" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a class="nav-item" href="/changelog" aria-label="Change log" title="Change log">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 3.5h8l4.5 4.5v3.5m-12.5-8v17h9m-6-12h5m-5 4h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.5 13a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z" stroke="currentColor" stroke-width="1.4"/><path d="M17.5 15.2v2.2l1.4.9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a class="nav-item" href="/match-simulator" aria-label="Match simulator" title="Match simulator">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9.25" stroke="currentColor" stroke-width="1.5"/><path d="m12 7.4 3.1 2.2-1.2 3.7h-3.8l-1.2-3.7L12 7.4Zm0 0V2.8m3.1 6.8 4.4-1.4M13.9 13.3l2.8 4m-6.6-4-2.8 4M8.9 9.6 4.5 8.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <button class="nav-item nav-settings" type="button" aria-label="Settings" aria-disabled="true" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 8.3a3.7 3.7 0 1 0 0 7.4 3.7 3.7 0 0 0 0-7.4Z" stroke="currentColor" stroke-width="1.6"/><path d="m19.2 14.8 1.3 1-.9 1.9-1.6-.2a7.5 7.5 0 0 1-1.2.9l-.3 1.6h-2.1l-.7-1.5a7.4 7.4 0 0 1-1.6 0l-.7 1.5h-2.1L9 18.4a7.5 7.5 0 0 1-1.2-.9l-1.6.2-.9-1.9 1.3-1a7.5 7.5 0 0 1 0-1.6l-1.3-1 .9-1.9 1.6.2A7.5 7.5 0 0 1 9 9.6l.3-1.6h2.1l.7 1.5a7.4 7.4 0 0 1 1.6 0l.7-1.5h2.1l.3 1.6a7.5 7.5 0 0 1 1.2.9l1.6-.2.9 1.9-1.3 1a7.5 7.5 0 0 1 0 1.6Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </nav>
    </aside>

    <div class="main-column draw-column">
      <header class="topbar">
        <a class="brand" href="/" aria-label="UCL Simulator XI home">
          <img class="brand-mark" src="/images/ucl-logo.png" alt="">
          <span class="brand-name">UCL SIMULATOR XI</span>
        </a>
        <div class="setup-season" aria-label="Season 2026 to 2027"><span>SEASON</span><strong>26/27</strong></div>
      </header>

      <main class="draw-main">
        <section class="draw-heading" aria-labelledby="draw-title">
          <div>
            <p class="draw-eyebrow"><span>02</span> PRELIMINARY PHASE</p>
            <h1 id="draw-title">The <span>draw.</span></h1>
          </div>
          <div class="draw-summary"><strong id="draw-team-count">36</strong><span>CLUBS</span><i></i><strong id="draw-fixture-count">144</strong><span>FIXTURES</span></div>
        </section>

        <div class="draw-error" id="draw-error" role="alert" hidden>
          <strong>Draw unavailable</strong>
          <span id="draw-error-message"></span>
          <a class="button button-secondary" href="/start-tournament">Change clubs</a>
        </div>

        <section class="pots-section" aria-label="Tournament pots">
          <div class="draw-section-heading"><div><p class="section-kicker">COEFFICIENT SEEDING</p><h2>Four pots</h2></div></div>
          <div class="pots-grid" id="pots-grid" aria-live="polite">
            <div class="draw-loading"><span class="loading-spinner" aria-hidden="true"></span><span>Preparing the draw…</span></div>
          </div>
        </section>

        <section class="draw-results-section" aria-labelledby="results-title">
          <div class="draw-section-heading"><div><p class="section-kicker">LEAGUE PHASE FIXTURES</p><h2 id="results-title">Drawn clubs</h2></div><span class="results-progress" id="results-progress">Waiting to begin</span></div>
          <div class="draw-results" id="draw-results" aria-live="polite"></div>
        </section>
      </main>
    </div>
  </div>

  <footer class="draw-dock" aria-label="Draw controls">
    <div class="draw-dock-status"><span class="draw-live-dot" aria-hidden="true"></span><strong id="draw-step-status">Preparing draw</strong></div>
    <div class="draw-actions">
      <button class="button button-secondary draw-next" id="draw-next" type="button" disabled><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.5 10h12m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Draw next opponent</span></button>
      <button class="button button-secondary draw-play" id="draw-play" type="button" disabled><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m7 4.5 9 5.5-9 5.5v-11Z" fill="currentColor"/></svg><span>Play</span></button>
      <button class="button button-secondary draw-finalize" id="draw-finalize" type="button" aria-label="Draw all remaining clubs instantly" disabled><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m3.5 4.5 5.2 5.5-5.2 5.5m7-11 5.2 5.5-5.2 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Finalize all draws</span></button>
      <button class="button button-primary draw-continue" id="draw-continue" type="button" disabled><span>Continue</span><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.5 10h12m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </footer>

  <script src="/assets/js/shared/site-config.js" defer></script>
  <script src="/assets/js/shared/app-settings.js" defer></script>
  <script src="/assets/js/pages/draw.js" defer></script>
</body>
</html>
